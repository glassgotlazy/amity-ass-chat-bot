<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Admission Assistant">
  <!--
    Default assistant mark, in Amity's brand colours (Supernova #ffca08 ring,
    Bahama Blue #006690 letterform). This is NOT the university emblem.
    Replace this whole file with the official logo to use that instead —
    see README.md in this folder.
  -->
  <style>
    .ring{ fill:none; stroke:#ffca08; stroke-width:1.5; }
    .mark{ fill:none; stroke:#006690; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
    @media (prefers-color-scheme: dark){ .mark{ stroke:#7cc2de; } }
  </style>
  <circle class="ring" cx="20" cy="20" r="17.5"/>
  <path class="mark" d="M13 26.5 20 12.5 27 26.5 M15.8 22.2h8.4"/>
</svg>
